apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
      - name: payment-api
        image: company/payment-api:1.0.0
        resources:
          requests:
              cpu: "100m"
              memory: "256Mi"
          limits:
              cpu: "200m"
              memory: "512Mi"